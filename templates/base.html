{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Roomly{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<header class="site-header">
  <div class="container">
    <a class="site-header__brand" href="{% url 'homepage:index' %}">
      <img class="roomly-logo" src="{% static 'homepage/img/logo.png' %}"
           alt="Roomly" width="44" height="44">
      <span>
        <span class="site-header__tagline">Расписание занятий</span>
      </span>
    </a>
  </div>
</header>

{% include "includes/navigation.html" %}

<main class="container flex-grow-1 pb-5">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    Учебный проект © <span id="current-year">{% now "Y" %}</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
