{# Главное меню. Активный раздел определяется по пространству имён URL. #}
{% with section=request.resolver_match.namespace %}
<nav class="navbar navbar-expand-lg roomly-nav mb-4" aria-label="Основная навигация">
  <div class="container">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#main-nav" aria-controls="main-nav"
            aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link{% if section == 'homepage' %} active{% endif %}"
             href="{% url 'homepage:index' %}">Главная</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if section == 'lessons' %} active{% endif %}"
             href="{% url 'lessons:list' %}">Занятия</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if section == 'teachers' %} active{% endif %}"
             href="{% url 'teachers:list' %}">Преподаватели</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if section == 'rooms' %} active{% endif %}"
             href="{% url 'rooms:list' %}">Аудитории</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
